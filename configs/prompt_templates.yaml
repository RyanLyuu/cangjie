templates:
  # 代码片段翻译 - 字段（静态）
  fragment_translation_field_static_icl: |-
    JAVA CODE:
    ```
    public class Calculator {
        public int x;
    }
    ```

    PARTIAL CANGJIE TRANSLATION:
    ```
    class Calculator {
        public x: Int64
    }
    ```

    CANGJIE FIELD TRANSLATION:
    ```
        public x: Int64 = 0
    ```

  # 代码片段翻译 - 方法（静态）
  fragment_translation_method_static_icl: |-
    JAVA CODE:
    ```
    public class Calculator {
        public int add(int a, int b) {
            return a + b;
        }
    }
    ```

    PARTIAL CANGJIE TRANSLATION:
    ```
    class Calculator {
        public func add(a: Int64, b: Int64): Int64 {
            // TODO: implement
        }
    }
    ```

    CANGJIE METHOD TRANSLATION:
    ```
        public func add(a: Int64, b: Int64): Int64 {
            return a + b
        }
    ```

  # 代码片段翻译 - 反馈
  fragment_translation_feedback_static_icl: |-
    JAVA CODE:
    ```
    public class Calculator {
        public int add(int a, int b) {
            return a + b;
        }
    }
    ```

    INCORRECT CANGJIE TRANSLATION:
    ```
    class Calculator {
        public func add(a: Int64, b: Int64): Int64 {
            return a + c
        }
    }
    ```

    EXECUTION FEEDBACK:
    ```
    error: cannot find 'c' in scope
    ```

    PARTIAL CANGJIE TRANSLATION:
    ```
    class Calculator {
        public func add(a: Int64, b: Int64): Int64 {
            // TODO: implement
        }
    }
    ```

    CANGJIE METHOD TRANSLATION:
    ```
        public func add(a: Int64, b: Int64): Int64 {
            return a + b
        }
    ```

  # 代码片段翻译 - 测试方法
  fragment_translation_test_static_icl: |-
    JAVA CODE:
    ```
    public class TestClass {
        @Test
        public void testMethod() {
            {{ source_statements }}
        }
    }
    ```

    PARTIAL CANGJIE TRANSLATION:
    ```
    import testing

    class TestClass {
        public func testMethod(): Void {
            // TODO: implement
        }
    }
    ```

    CANGJIE METHOD TRANSLATION:
    ```
        public func testMethod(): Void {
            {{ target_statements }}
        }
    ```

  # 代码片段翻译 - 测试反馈
  fragment_translation_feedback_test_static_icl: |-
    JAVA CODE:
    ```
    public class TestClass {
        @Test
        public void testMethod() {
            List<String> inputList = Arrays.asList("apple", "banana", "cherry");
            assertEquals("inputList size does not match expected size = 3", 3, inputList.size());
        }
    }
    ```

    INCORRECT CANGJIE TRANSLATION:
    ```
    class TestClass {
        public func testMethod(): Void {
            let inputList: Array<String> = ["apple", "banana", "cherry"]
            @Test.assertEquals("inputList size does not match expected size = 3", 3, inputList.size())
        }
    }
    ```

    EXECUTION FEEDBACK:
    ```
    error: argument count mismatch
    expected 3 arguments but got 4
    ```

    PARTIAL CANGJIE TRANSLATION:
    ```
    import testing

    class TestClass {
        public func testMethod(): Void {
            // TODO: implement
        }
    }
    ```

    CANGJIE METHOD TRANSLATION:
    ```
        public func testMethod(): Void {
            let inputList: Array<String> = ["apple", "banana", "cherry"]
            @Test.assertEquals(3, inputList.size(), "inputList size does not match expected size = 3")
        }
    ```

  # 指令提示
  fragment_translation_instruction: |-
    INSTRUCTION:
    Translate the following JAVA {{ fragment_type }} to CANGJIE. You only need to translate the "{{ fragment_actual_name }}" {{ fragment_type }}. All necessary dependencies are available in PARTIAL CANGJIE TRANSLATION.

  fragment_translation_feedback_instruction: |-
    INSTRUCTION:
    Based on the feedback provided, identify the error in the following CANGJIE translation of the {{ fragment_type }} and correct it. You only need to correct the "{{ fragment_actual_name }}" {{ fragment_type }}. All necessary dependencies are available in PARTIAL CANGJIE TRANSLATION. Only generate the given "{{ fragment_actual_name }}" method like the example above and do not add anything else in your response.

  fragment_translation_partial_translation: |-
    PARTIAL CANGJIE TRANSLATION:
    ```
    {{ partial_translation }}
    ```

  target_translation: |-
    {{ target_translation_heading }}:
    ```
    {{ partial_target_translation }}
    ```

  fragment_translation_response_format: |-
    RESPONSE FORMAT: You must provide your response in the following format by enclosing {{ target_translation_heading }} inside three backticks. DO NOT include any additional information in your response. Your response should only contain the translated {{ fragment_type }} without any other {{ target_language.upper() }} code syntax (e.g., assignments, definitions, expressions).

    {{ target_translation_heading }}:
    ```
    <{{ target_language.lower() }}_translation>
    ```

  fragment_translation_notes: |-
    GENERAL NOTES:
      1) If you are translating a test method, make sure the order of arguments in the assert functions is correct as given in the sample example. Specifically, the "message" argument is the first argument in Java, but the last argument in Cangjie. For example, in Java, assertEquals("message", expected, actual) and in Cangjie, @Test.assertEquals(expected, actual, "message").
      2) You have to make sure your translation correctly calls dependent methods given in PARTIAL CANGJIE TRANSLATION. For example, if a method's name is "__methodName" in class "ClassName" in PARTIAL CANGJIE TRANSLATION, you have to call the method as "ClassName().__methodName()" in your translation.
      3) If you are referencing private and protected fields of a class in your translation, you have to use the correct syntax. For example, if a field's name is "__fieldName" in class "ClassName" in PARTIAL CANGJIE TRANSLATION, you have to reference the field as "_ClassName__fieldName" in your translation.
      4) The model response should not change the method signature. Please generate the signature exactly given in PARTIAL CANGJIE TRANSLATION.

  type_translation_details: |-
    TYPE TRANSLATION DETAILS:
    ```
    {{ type_translation_details }}
    ```

  api_call_description: |-
    API CALL DESCRIPTION:
    ```
    {{ api_call_description }}
    ```

  # 高级 LLM 提示 - 基础
  advanced_llm_prompt_base: |-
    INSTRUCTION:
    1. Below is the EXECUTION TRACE and STACK TRACE of a failed test case, along with all executed methods ordered in reverse-execution order.
    2. Your task is to analyze the STACK TRACE and each pair of JAVA SOURCE CODE and CANGJIE TRANSLATION of the methods in the EXECUTION TRACE.
    3. You need to identify the root cause of the failure and provide fixed CANGJIE TRANSLATION for the methods that are causing the failure. Please make sure your generated Cangjie translation is syntactically correct and can be executed without any errors.
    4. There could be multiple buggy methods in the EXECUTION TRACE. You need to provide fixed CANGJIE TRANSLATION for all of them.
    5. The bugs can also exist in test methods. You need to provide fixed CANGJIE TRANSLATION for test methods as well.
    6. The fixed CANGJIE TRANSLATION (with proper indentation and parseable by Cangjie grammar) of each method should be provided as a LIST of JSON objects like below.
    7. Make sure the "id" field exactly matches the "id" field in the EXECUTION TRACE with proper line numbers.
    8. Make sure your generated code has EXACTLY the same INDENTATION as the original code. Do NOT add or remove any indentation from your generated code.
    9. Make sure you DO NOT change the signature of the methods. It's important to keep the method signature intact for parsing purposes.
    ```
    [
        {
            "id": "<schema_name>|<class_name>|<fragment_name>",
            "fixed_cangjie_translation": "<fixed_cangjie_translation>",
        },
        {
            "id": "<schema_name>|<class_name>|<fragment_name>",
            "fixed_cangjie_translation": "<fixed_cangjie_translation>",
        },
        ...
        {
            "id": "<schema_name>|<class_name>|<fragment_name>",
            "fixed_cangjie_translation": "<fixed_cangjie_translation>",
        }
    ]
    ```

    EXECUTION TRACE:
    ```
    {{ execution_trace }}
    ```

    STACK TRACE:
    ```
    {{ stack_trace }}
    ```

  advanced_llm_prompt_instance: |-
    IDENTIFIER:
    ```
    {{ identifier }}
    ```

    API DESCRIPTION (if any):
    ```
    {{ api_description }}
    ```

    JAVA SOURCE CODE:
    ```
    {{ java_source_code }}
    ```

    CANGJIE TRANSLATION:
    ```
    {{ cangjie_translation }}
    ```

  advanced_llm_prompt_dependencies: |-
    DEPENDENCIES:
    Below are the dependencies used in the JAVA SOURCE CODE which are not available in the EXECUTION TRACE. You need to consider them while generating the fixed CANGJIE TRANSLATION.
    {{ test_dependencies }}

  # ------------------------------------------------------------------
  # Part 1: Pseudocode intermediate layer (semantic bridge)
  # Phase-1 prompt: Java fragment → annotated pseudocode (LLM call)
  # ------------------------------------------------------------------
  pseudocode_generation_system: |-
    You are a code comprehension engine. Your job is to read a Java fragment and
    describe its semantic intent and logic in language-agnostic pseudocode annotated
    with natural-language comments. The pseudocode is later used as a translation
    bridge to a target language. You must NOT use Java-specific syntax or APIs.
    Express ALL operations in plain pseudo-statements and accompany each block with a
    natural-language comment describing its purpose.

  pseudocode_generation_user: |-
    JAVA FRAGMENT ({{ fragment_type }} "{{ fragment_actual_name }}"):
    ```
    {{ java_source_code }}
    ```

    TASK: Produce a pseudocode description of the above fragment following these rules:
    1. Output ONE block of pseudocode inside triple backticks.
    2. Use plain control-flow keywords (FOR / WHILE / IF / ELSE / RETURN / BREAK) only.
    3. Replace every Java API call with a high-level verb phrase describing intent.
       Example: `Collections.sort(xs)` -> `sort xs in place`.
       Example: `System.out.println(p)` -> `print p`.
    4. Each logical block MUST be preceded by a single-line comment starting with `//`
       that explains the intent in natural language.
    5. Do NOT mention Cangjie, Python, or any other target language.
    6. Keep the same control-flow order and variable names (when meaningful).

    Pseudocode:
    ```
    < REPLACE THIS LINE WITH YOUR PSEUDOCODE >
    ```

  pseudocode_bridge_context: |-
    ### Semantic Bridge (pseudocode)
    The pseudocode below captures the intent and logic of the Java fragment without
    using Java-specific syntax. Use it as the authoritative description of WHAT to
    translate; fall back to the Java code only when the pseudocode is ambiguous.

    ```
    {{ pseudocode }}
    ```

  # ------------------------------------------------------------------
  # Part 2: Cangjie grammar / EBNF injection
  # ------------------------------------------------------------------
  cangjie_grammar_context: |-
    ### Cangjie Grammar Reference (EBNF excerpt — must obey in output)
    The following grammar rules describe Cangjie syntax you MUST follow. Treat each
    rule as a hard constraint on the generated Cangjie code; deviations cause compile
    errors. The EBNF uses `|` for alternation, `[ ]` for optional, `{ }` for zero-or-more.

    ########## Type & variable declarations ##########
    var_decl      ::= "let" IDENT ":" TYPE "=" EXPR          # immutable
                    | "var" IDENT ":" TYPE "=" EXPR          # mutable
    TYPE          ::= IDENT [ "<" TYPE { "," TYPE } ">" ]
    func_decl     ::= "func" IDENT "(" [ PARAMS ] ")" [ ":" TYPE ] "{" STMTS "}"
    PARAMS        ::= PARAM { "," PARAM }
    PARAM         ::= IDENT ":" TYPE
    field_decl    ::= [ "public" | "private" | "protected" | "static" ] (var_decl | func_decl)

    ########## Class / interface / enum ##########
    class_decl    ::= ("class" | "abstract class" | "open class") IDENT [ GENERIC_PARAMS ] [ ":" SUPERTYPE { "," SUPERTYPE } ] "{" MEMBERS "}"
    interface_decl::= "interface" IDENT [ GENERIC_PARAMS ] "{" MEMBER_SIGS "}"
    GENERIC_PARAMS::= "<" TYPE_PARAM { "," TYPE_PARAM } ">"
    TYPE_PARAM    ::= IDENT [ "where" IDENT "<:" TYPE ]

    ########## Control flow ##########
    if_stmt       ::= "if" "(" COND ")" BLOCK [ "else" BLOCK | "else if" "(" COND ")" BLOCK ]
    while_stmt    ::= "while" "(" COND ")" BLOCK
    for_stmt      ::= "for" "(" IDENT [ ":" TYPE ] "in" EXPR ")" BLOCK
    match_stmt    ::= "match" "(" EXPR ")" "{" { CASE_PATTERN "=>" BLOCK } "}"
    return_stmt   ::= "return" [ EXPR ]

    ########## Hard semantic constraints (must satisfy to compile) ##########
    G1. Generic bounds use `where T <: Bound`, NOT extends/super. There is no wildcard.
    G2. Declaration-site variance via `out T` (covariant) / `in T` (contravariant);
        use-site `?` / `~` is NOT supported — use type projection `~T` only on the
        generic method side.
    G3. `Any` does NOT satisfy `Hashable & Equatable<T>`. Whenever Any would appear as a
        HashMap/HashSet key or element type, use `AnyHashable` instead
        (import from the project's AnyHashable.cj).
    G4. Integer / float literals carry type suffix to disambiguate from Int32 default;
        prefer `Int64`/`UInt64`/`Float64` and annotate explicitly.
    G5. Boolean type is `Bool`, not `boolean`. The nullability marker is `?` (e.g. `String?`).
    G6. String interpolation: `"${expr}"`, not Java `"%" + x` or String.format.
    G7. Unit (void) functions: declare return type `Unit` explicitly when side-effect free,
        omit `return` or `return None`.
    G8. Operator overloading uses `operator func`; equality is `func operator func ==(rhs: Self): Bool`.

  cangjie_grammar_runtime_note: |-
    RUNTIME NOTES (names you MUST NOT use; equivalent mappings):
      Object (HashMap/HashSet key/elt)  -> AnyHashable
      ThreadFactory                     -> () -> Thread
      Runnable                          -> () -> Unit
      Callable<V>                       -> () -> V
      Function<T, R>                    -> (T) -> R
      Consumer<T>                       -> (T) -> Unit
      Supplier<T>                       -> () -> T
      Predicate<T>                      -> (T) -> Bool
      Comparator<T>                     -> (T, T) -> Int64
      List<T>                           -> Array<T>
      Map<K, V>                         -> HashMap<K, V>
      Set<T>                            -> HashSet<T>

  # ------------------------------------------------------------------
  # Part 3: Syntax-graph RAG context (structural CFG/DFG examples)
  # ------------------------------------------------------------------
  syntax_graph_context: |-
    ### Structural Examples (retrieved from CangjieCorpus)
    The following Cangjie snippets have control-flow / data-flow graphs that are
    structurally similar to the Java fragment being translated. Use them as idiomatic
    templates for HOW to render the logic in Cangjie — particularly the surrounding
    class skeleton, the function signature form, and the idiomatic use of match / let /
    for-in. Do NOT copy them verbatim; adapt to the actual types and API calls.

    {{ top_examples }}
